name: Github Page Docs
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # `latest` falls back to v0.9.1 after the wasm-pack repository redirect.
          # Pin a modern release so wasm-opt supports wasm-bindgen's output.
          version: 'v0.15.1'

      - name: Cache Rust Deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-

      - name: Install Node
        uses: actions/setup-node@v7

      - name: Build WASM
        run: wasm-pack build --target web && cd pkg && npm install

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0
          run_install: |
              - recursive: true

      - name: Vite Build 🔧
        run: pnpm build
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/dist

  # Deployment job
  deploy:
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
